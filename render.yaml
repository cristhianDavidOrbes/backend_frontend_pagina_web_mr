services:
  - type: web
    name: algolab-backend
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: backend/backend-werb-mr/backend-werb-mr/Dockerfile
    dockerContext: backend/backend-werb-mr/backend-werb-mr
    healthCheckPath: /api/ranking
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: algolab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0
      - key: DOS_FA_ENABLED
        value: "false"
      - key: DOS_FA_REQUIRED
        value: "false"

databases:
  - name: algolab-db
    plan: free
    region: virginia
    ipAllowList: []
