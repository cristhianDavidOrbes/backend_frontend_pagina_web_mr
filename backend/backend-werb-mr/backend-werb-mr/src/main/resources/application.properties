spring.application.name=backend-werb-mr
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:${PGUSER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
# En desarrollo se genera un secreto efimero seguro. En Railway/produccion se
# debe definir JWT_SECRET para conservar sesiones entre reinicios e instancias.
# Nunca se usa una clave publica conocida que permita falsificar identidades.
app.jwt.secret=${JWT_SECRET:${random.value}${random.value}}
app.jwt.expiracion-ms=${JWT_EXPIRACION_MS:86400000}
app.admin.nombre=${ADMIN_NOMBRE:Cristhian David}
app.admin.correo=${ADMIN_CORREO:administrador@campusucc.edu.co}
app.admin.contrasena=${ADMIN_CONTRASENA:}

# Segundo factor por correo institucional. El backend no revela ni registra el
# codigo cuando SMTP no esta configurado: en ese caso responde HTTP 503.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}

app.segundo-factor.remitente=${SMTP_FROM:${SMTP_USERNAME:}}
app.segundo-factor.nombre-remitente=${SMTP_FROM_NAME:AlgoLab}
app.segundo-factor.expiracion-segundos=${DOS_FA_EXPIRATION_SECONDS:300}
app.segundo-factor.reenvio-segundos=${DOS_FA_RESEND_COOLDOWN_SECONDS:60}
app.segundo-factor.max-intentos=${DOS_FA_MAX_ATTEMPTS:5}

# SMS real opcional mediante Twilio. Si falta cualquiera de estas variables,
# el canal SMS se considera no disponible y responde 503; nunca se simula.
app.segundo-factor.twilio-account-sid=${TWILIO_ACCOUNT_SID:}
app.segundo-factor.twilio-auth-token=${TWILIO_AUTH_TOKEN:}
app.segundo-factor.twilio-from-number=${TWILIO_FROM_NUMBER:}
